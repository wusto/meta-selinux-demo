BB_CONF_FRAGMENT_SUMMARY = "Enable the DISTRO_FEATURES and refpolicy provider needed for the SELinux demo"
BB_CONF_FRAGMENT_DESCRIPTION = "Adds the acl, xattr, pam and selinux distro features required to build \
and run SELinux refpolicy on the target, and selects refpolicy-standard as the \
provider for virtual/refpolicy."

DISTRO_FEATURES:append = " acl xattr pam selinux"
PREFERRED_PROVIDER_virtual/refpolicy ?= "refpolicy-standard"
